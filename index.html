<title>Quiz dos Indecisos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFEDF6;
    --surface:#FFFFFF;
    --surface-soft:#F7F6FC;
    --ink:#201D2E;
    --ink-soft:#615C78;
    --ink-faint:#928DA6;
    --border:#DDD9EC;
    --accent:#4B3FE0;
    --accent-ink:#FFFFFF;
    --lula:#B3282E;
    --lula-soft:#F6E2E3;
    --bolsonaro:#1F7A4C;
    --bolsonaro-soft:#DFF0E6;
    --blank:#8B8798;
    --blank-soft:#ECEAF2;
    --shadow: 0 1px 2px rgba(32,29,46,.06), 0 10px 28px rgba(32,29,46,.09);
    --font-body:'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-title:'Big Shoulders Display', 'Arial Narrow', sans-serif;
    --brand-blue:#1848C4;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    padding-inline:16px;
  }
  .shell{
    max-width:620px;
    margin:0 auto;
    padding-block:20px 48px;
    min-height:100%;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    background:var(--bg);
    padding-block:8px 6px;
    z-index:5;
  }
  .topbar-top{
    margin-bottom:14px;
  }
  .brand{
    display:flex;
    align-items:flex-end;
    gap:10px;
  }
  .brand-mark{
    height:58px;
    width:auto;
    flex-shrink:0;
  }
  .brand-row{
    flex:1;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    min-width:0;
  }
  .brand-title{
    display:flex;
    flex-direction:column;
    gap:1px;
    margin:0;
  }
  .brand-name{
    font-family:var(--font-title);
    text-transform:uppercase;
    font-weight:800;
    font-size:clamp(25px, 7.5vw, 33px);
    line-height:0.92;
    letter-spacing:.01em;
    color:var(--brand-blue);
  }
  .brand-super{
    font-family:var(--font-body);
    font-weight:500;
    font-size:clamp(12.5px, 3.4vw, 14px);
    letter-spacing:.02em;
    color:var(--ink);
  }
  .qbar{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .qbar[hidden]{display:none;}
  .q-counter{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    line-height:1;
    flex-shrink:0;
  }
  .q-counter[hidden]{display:none;}
  .q-counter-num{
    font-family:var(--font-body);
    font-weight:800;
    font-size:20px;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .q-counter-label{
    font-family:var(--font-body);
    font-weight:600;
    font-size:9px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-top:3px;
  }
  .progress-track{
    display:flex;
    gap:4px;
    flex:1;
    min-width:0;
  }
  .progress-seg{
    height:4px;
    flex:1;
    border-radius:2px;
    background:var(--border);
    overflow:hidden;
  }
  .progress-seg > span{
    display:block;
    height:100%;
    width:0%;
    background:var(--accent);
    border-radius:2px;
    transition:width .35s ease;
  }

  main{flex:1; display:flex; flex-direction:column;}

  /* ---- Intro & result shared blocks ---- */
  .hero{
    padding-block:20px 8px;
  }
  .eyebrow{
    font-family:var(--font-body);
    font-weight:600;
    font-size:12px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 10px;
  }
  h1{
    font-family:var(--font-body);
    font-weight:800;
    font-size:clamp(28px, 7vw, 40px);
    line-height:1.14;
    text-wrap:balance;
    margin:0 0 26px;
    letter-spacing:-.015em;
  }
  .lede{
    font-size:16px;
    line-height:1.6;
    color:#322E3D;
    margin:0 0 28px;
  }
  .notes-box{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 20px;
    margin:28px 0 8px;
  }
  .notes-label{
    font-family:var(--font-body);
    font-weight:600;
    font-size:11px;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 12px;
  }
  .rules{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin:0;
    padding:0;
  }
  .rules li{
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-size:14px;
    line-height:1.5;
    color:var(--ink-faint);
    list-style:none;
  }
  .rules li::before{
    content:"";
    width:6px;height:6px;
    border-radius:50%;
    background:var(--ink-faint);
    margin-top:7px;
    flex-shrink:0;
  }

  .btn{
    font-family:var(--font-body);
    font-weight:600;
    font-size:15px;
    border-radius:999px;
    border:1px solid transparent;
    padding:14px 28px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{
    background:var(--accent);
    color:var(--accent-ink);
    box-shadow:var(--shadow);
  }
  .btn-primary:hover{box-shadow:0 1px 2px rgba(32,29,46,.08), 0 14px 32px rgba(75,63,224,.28);}
  .btn-ghost{
    background:transparent;
    color:var(--ink-soft);
    border-color:var(--border);
  }
  .btn-ghost:hover{
    color:var(--ink);
    border-color:var(--accent);
  }

  /* ---- Question screen ---- */
  .back-btn{
    width:36px;height:36px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .back-btn:hover{color:var(--ink); border-color:var(--accent);}
  .back-btn:disabled{visibility:hidden;}

  .qprompt{
    font-family:var(--font-body);
    font-size:15px;
    font-weight:500;
    color:var(--ink-soft);
    margin:0 0 16px;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:18px;
  }
  .option-btn{
    text-align:left;
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:18px;
    padding:20px 20px;
    cursor:pointer;
    display:flex;
    gap:14px;
    align-items:flex-start;
    font-family:var(--font-body);
    color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease, transform .15s ease;
  }
  .option-btn:hover{
    border-color:var(--accent);
    box-shadow:var(--shadow);
  }
  .option-btn:active{transform:scale(.99);}
  .option-mark{
    width:26px;height:26px;
    border-radius:50%;
    border:1.5px solid var(--border);
    flex-shrink:0;
    margin-top:2px;
  }
  .option-btn:hover .option-mark{border-color:var(--accent);}
  .option-text{
    font-size:17px;
    line-height:1.5;
    font-weight:500;
  }

  /* ---- Result screen ---- */
  .result-headline{
    margin-bottom:6px;
  }
  .result-headline .name-lula{color:var(--lula);}
  .result-headline .name-bolsonaro{color:var(--bolsonaro);}

  .meter{
    margin:28px 0 8px;
  }
  .meter-labels{
    display:flex;
    justify-content:space-between;
    font-family:var(--font-body);
    font-weight:600;
    font-size:13px;
    font-variant-numeric:tabular-nums;
    margin-bottom:8px;
  }
  .meter-labels .lula{color:var(--lula);}
  .meter-labels .bolsonaro{color:var(--bolsonaro);}
  .meter-bar{
    display:flex;
    height:14px;
    border-radius:8px;
    overflow:hidden;
    background:var(--blank-soft);
    border:1px solid var(--border);
  }
  .meter-bar .seg{height:100%; width:0%; transition:width .5s ease;}
  .meter-bar .seg-lula{background:var(--lula);}
  .meter-bar .seg-bolsonaro{background:var(--bolsonaro);}
  .meter-bar .seg-blank{background:var(--blank-soft);}
  .meter-foot{
    display:flex;
    gap:16px;
    margin-top:10px;
    font-size:12.5px;
    color:var(--ink-faint);
  }
  .legend-dot{
    display:inline-block;
    width:8px;height:8px;
    border-radius:50%;
    margin-right:5px;
    vertical-align:middle;
  }

  .breakdown{
    margin-top:36px;
  }
  .breakdown h2{
    font-family:var(--font-body);
    font-weight:700;
    font-size:19px;
    margin:0 0 4px;
  }
  .breakdown-sub{
    font-size:13px;
    color:var(--ink-faint);
    margin:0 0 16px;
  }
  .breakdown-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .breakdown-row{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    display:flex;
    align-items:flex-start;
    gap:12px;
  }
  .breakdown-main{flex:1; min-width:0;}
  .breakdown-cat{
    font-family:var(--font-body);
    font-weight:600;
    font-size:11px;
    color:var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:.05em;
    margin:0 0 4px;
  }
  .breakdown-label{
    font-family:var(--font-body);
    font-weight:700;
    font-size:11.5px;
    color:var(--ink-faint);
    margin:0 0 4px;
  }
  .breakdown-text{
    font-size:14px;
    line-height:1.45;
    color:var(--ink-soft);
    margin:0;
  }
  .breakdown-side{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:8px;
    flex-shrink:0;
  }
  .chip{
    flex-shrink:0;
    font-family:var(--font-body);
    font-weight:600;
    font-size:12px;
    padding:5px 11px;
    border-radius:999px;
    white-space:nowrap;
  }
  .chip-lula{background:var(--lula-soft); color:var(--lula);}
  .chip-bolsonaro{background:var(--bolsonaro-soft); color:var(--bolsonaro);}
  .chip-blank{background:var(--blank-soft); color:var(--blank);}
  .breakdown-sources{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--border);
  }

  .sources-cat{
    font-family:var(--font-body);
    font-weight:600;
    font-size:10.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 3px;
  }
  .sources-row{
    font-size:13px;
    line-height:1.5;
    margin:0 0 3px;
  }
  .sources-row:last-child{margin-bottom:0;}
  .sources-label-lula{color:var(--lula); font-weight:600;}
  .sources-label-bolsonaro{color:var(--bolsonaro); font-weight:600;}
  .sources-link{
    color:var(--accent);
    text-decoration:underline;
    text-decoration-color:var(--border);
    text-underline-offset:2px;
  }
  .sources-link:hover{text-decoration-color:var(--accent);}

  .result-actions{
    margin-top:32px;
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
  }

  .fade-in{
    animation:fadeIn .38s ease both;
  }
  @media (prefers-reduced-motion: reduce){
    .fade-in{animation:none;}
    .progress-seg > span, .meter-bar .seg, .btn, .option-btn{transition:none;}
  }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }

  @media (max-width:420px){
    .option-text{font-size:16px;}
    h1{font-size:30px; font-weight:900;}
  }
</style>

  function getVariant(){
    try {
      var v = localStorage.getItem('qi_variant');
      if (v !== 'A' && v !== 'B'){
        v = Math.random() < 0.5 ? 'A' : 'B';
        localStorage.setItem('qi_variant', v);
      }
      return v;
    } catch(e){
      return Math.random() < 0.5 ? 'A' : 'B';
    }
  }

  function getSessionId(){
    try {
      var id = sessionStorage.getItem('qi_session_id');
      if (!id){
        id = 'sid_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
        sessionStorage.setItem('qi_session_id', id);
      }
      return id;
    } catch(e){
      return 'sid_' + Date.now().toString(36);
    }
  }

  function track(eventName, extra){
    if (!ANALYTICS_ENDPOINT) return;
    var payload = {
      sessionId: getSessionId(),
      variant: VARIANT,
      event: eventName,
      ts: new Date().toISOString()
    };
    for (var k in (extra || {})) payload[k] = extra[k];
    try {
      fetch(ANALYTICS_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(payload)
      }).catch(function(){});
    } catch(e){}
  }

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs){
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function(c){
      if (c == null) return;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  }

  function buildProgress(){
    progressTrack.innerHTML = '';
    for (var i = 0; i < TOTAL; i++){
      var seg = el('div', {class:'progress-seg'}, [el('span')]);
      progressTrack.appendChild(seg);
    }
  }
  buildProgress();

  function updateProgress(currentIdx){
    var segs = progressTrack.querySelectorAll('.progress-seg > span');
    segs.forEach(function(s, i){
      s.style.width = (i < currentIdx) ? '100%' : (i === currentIdx ? '50%' : '0%');
    });
  }

  function scoreAll(){
    var score = {lula:0, bolsonaro:0, blank:0};
    state.answers.forEach(function(ans, i){
      if (ans === 'blank' || ans === null){ score.blank++; return; }
      var q = QUESTIONS[i];
      var side = ans === 'a' ? q.a : q.b;
      score[side.c]++;
    });
    return score;
  }

      el('li', {}, ['Todas as fontes são apresentadas ao final do quiz.'])
    ]);
    var notesBox = el('div', {class:'notes-box'}, [
      el('p', {class:'notes-label'}, ['Observações']),
      rules
    ]);
    wrap.appendChild(notesBox);
    main.appendChild(wrap);
  }

  function renderQuestion(idx){
    qBar.hidden = false;
    qCounter.hidden = false;
    updateProgress(idx);
    qCounterNum.textContent = (idx + 1) + '/' + TOTAL;
    backBtn.onclick = function(){ if (idx === 0) { state.stage = 'intro'; render(); } else { goTo(idx - 1); } };
    var q = QUESTIONS[idx];
    main.innerHTML = '';

    var wrap = el('div', {class:'fade-in'});

    var catEmoji = CAT_EMOJI[q.cat] || '';
    wrap.appendChild(el('p', {class:'eyebrow', style:'margin:16px 0 4px; color:var(--ink); font-weight:800; font-size:17px;'}, [(catEmoji ? catEmoji + ' ' : '') + q.cat]));
    wrap.appendChild(el('p', {class:'qprompt'}, [q.prompt || 'Qual frase está mais perto do que você pensa?']));

    var options = el('div', {class:'options'});
    ['a','b'].forEach(function(key){
      var opt = q[key];
      var btn = el('button', {
        class:'option-btn',
        onclick: function(){ state.answers[idx] = key; track('answer', {qIdx: idx, cat: q.cat, answer: key}); advance(idx); }
      }, [
        el('span', {class:'option-mark'}),
        el('span', {class:'option-text'}, [opt.text])
      ]);
      options.appendChild(btn);
    });
    var skipBtn = el('button', {
      class:'option-btn',
      onclick: function(){ state.answers[idx] = 'blank'; track('answer', {qIdx: idx, cat: q.cat, answer: 'blank'}); advance(idx); }
    }, [
      el('span', {class:'option-mark'}),
      el('span', {class:'option-text'}, ['Não sei / prefiro não responder'])
    ]);
    options.appendChild(skipBtn);
    wrap.appendChild(options);

    main.appendChild(wrap);
  }

  function advance(idx){
    if (idx + 1 < TOTAL){ goTo(idx + 1); }
    else { state.stage = 'result'; render(); }
  }

  function goTo(idx){
    state.stage = idx;
    render();
  }

  function renderResult(){
    qBar.hidden = true;
    qCounter.hidden = true;
    main.innerHTML = '';

    var score = scoreAll();
    var leader = null;
    if (score.lula > score.bolsonaro) leader = 'lula';
    else if (score.bolsonaro > score.lula) leader = 'bolsonaro';
    track('complete', {
      lula: score.lula,
      bolsonaro: score.bolsonaro,
      blank: score.blank,
      lulaPct: Math.round(score.lula / TOTAL * 1000) / 10,
      bolsonaroPct: Math.round(score.bolsonaro / TOTAL * 1000) / 10,
      blankPct: Math.round(score.blank / TOTAL * 1000) / 10,
      leader: leader || 'empate'
    });

    var wrap = el('div', {class:'hero fade-in'});
    wrap.appendChild(el('p', {class:'eyebrow'}, ['Resultado']));

    var h1 = el('h1', {class:'result-headline'});
    if (leader){
      h1.appendChild(document.createTextNode('Você pensa mais parecido com '));
      h1.appendChild(el('span', {class:'name-' + leader}, [NAMES[leader]]));
    } else {
      h1.appendChild(document.createTextNode('Suas respostas ficaram empatadas'));
    }
    wrap.appendChild(h1);

    wrap.appendChild(el('p', {class:'lede'}, [
      leader
        ? 'Das ' + TOTAL + ' perguntas, mais das suas respostas coincidiram com posições associadas a ' + NAMES[leader] + '.'
        : 'Você somou o mesmo número de pontos para os dois lados: ou deixou perguntas suficientes em branco para empatar o placar.'
    ]));

    var meter = el('div', {class:'meter'});
    meter.appendChild(el('div', {class:'meter-labels'}, [
      el('span', {class:'lula'}, ['Lula · ' + score.lula]),
      el('span', {class:'bolsonaro'}, ['Bolsonaro · ' + score.bolsonaro])
    ]));
    var bar = el('div', {class:'meter-bar'});
    var segLula = el('div', {class:'seg seg-lula'});
    var segBlank = el('div', {class:'seg seg-blank'});
    var segBols = el('div', {class:'seg seg-bolsonaro'});
    bar.appendChild(segLula); bar.appendChild(segBlank); bar.appendChild(segBols);
    meter.appendChild(bar);
    meter.appendChild(el('div', {class:'meter-foot'}, [
      el('span', {}, [el('span', {class:'legend-dot', style:'background:var(--blank)'}), 'Em branco · ' + score.blank])
    ]));
    wrap.appendChild(meter);

    requestAnimationFrame(function(){
      segLula.style.width = (score.lula / TOTAL * 100) + '%';
      segBlank.style.width = (score.blank / TOTAL * 100) + '%';
      segBols.style.width = (score.bolsonaro / TOTAL * 100) + '%';
    });

    var breakdown = el('div', {class:'breakdown'});
    breakdown.appendChild(el('h2', {}, ['Suas respostas']));
    breakdown.appendChild(el('p', {class:'breakdown-sub'}, ['A opção que você marcou em cada pergunta, com as fontes dos dois lados.']));
    var list = el('div', {class:'breakdown-list'});
    QUESTIONS.forEach(function(q, i){
      var ans = state.answers[i];
      var chipClass, chipText, text;
      if (ans === 'a' || ans === 'b'){
        var side = ans === 'a' ? q.a : q.b;
        chipClass = 'chip-' + side.c;
        chipText = NAMES[side.c];
        text = side.text;
      } else {
        chipClass = 'chip-blank';
        chipText = 'Não sei';
        text = q.a.text + ' / ' + q.b.text;
      }
      var sourcesWrap = el('div', {class:'breakdown-sources'});
      sourcesWrap.appendChild(el('p', {class:'sources-cat'}, ['Fontes']));
      ['lula', 'bolsonaro'].forEach(function(cand){
        var srcs = (q.sources || []).filter(function(s){ return s.c === cand; });
        if (!srcs.length) return;
        var row = el('p', {class:'sources-row'});
        row.appendChild(el('span', {class:'sources-label-' + cand}, [NAMES[cand] + ': ']));
        srcs.forEach(function(src, si){
          if (si > 0) row.appendChild(document.createTextNode(' · '));
          row.appendChild(el('a', {
            href: src.url, target:'_blank', rel:'noopener noreferrer', class:'sources-link'
          }, [src.label]));
        });
        sourcesWrap.appendChild(row);
      });
      var row = el('div', {class:'breakdown-row'}, [
        el('div', {class:'breakdown-main'}, [
          el('p', {class:'breakdown-cat'}, [q.cat]),
          el('p', {class:'breakdown-label'}, ['Opção que você marcou:']),
          el('p', {class:'breakdown-text'}, [text]),
          sourcesWrap
        ]),
        el('div', {class:'breakdown-side'}, [
          el('span', {class:'chip ' + chipClass}, [chipText])
        ])
      ]);
      list.appendChild(row);
    });
    breakdown.appendChild(list);
    wrap.appendChild(breakdown);

    var shareBtn = el('button', {
      class:'btn btn-primary',
      onclick: function(){
        var shareData = {
          title: 'Quiz dos Indecisos',
          text: 'Com quem você pensa mais parecido: Lula ou Bolsonaro? Responda o quiz:',
          url: location.href
        };
        if (navigator.share){
          navigator.share(shareData).then(function(){
            track('share', {lula: score.lula, bolsonaro: score.bolsonaro, blank: score.blank});
          }).catch(function(){});
        } else if (navigator.clipboard){
          navigator.clipboard.writeText(shareData.text + ' ' + shareData.url).then(function(){
            track('share', {lula: score.lula, bolsonaro: score.bolsonaro, blank: score.blank});
            var original = shareBtn.textContent;
            shareBtn.textContent = 'Link copiado!';
            setTimeout(function(){ shareBtn.textContent = original; }, 2000);
          }).catch(function(){});
        }
      }
    }, ['Compartilhar quiz']);

    wrap.appendChild(el('div', {class:'result-actions'}, [
      el('button', {
        class:'btn btn-primary',
        onclick: function(){
          state.answers = new Array(TOTAL).fill(null);
          state.stage = 'intro';
          render();
        }
      }, ['Refazer o quiz']),
      shareBtn
    ]));

    main.appendChild(wrap);
    window.scrollTo(0,0);
  }

  function render(){
    if (state.stage === 'intro') renderIntro();
    else if (state.stage === 'result') renderResult();
    else renderQuestion(state.stage);
  }

  render();
})();
</script>
